spring.application.name=PayBatchTool


paybatch.schedule.interval=5m

payment.input-dir=/data/payments/input
payment.processed-dir=/data/payments/processed
payment.error-dir=/data/payments/error
payment.duplicate-dir=/data/payments/duplicate

# SOAP retry configuration
payment.api.max-retries=3








# WSDL URLs
soap.customersearch.wsdl-url=https://example.com/CustomerSearchService?wsdl
soap.financialallocation.wsdl-url=https://example.com/FinancialAllocationWriteService?wsdl

# WS-Security credentials
soap.username=myuser
soap.password=mypass
